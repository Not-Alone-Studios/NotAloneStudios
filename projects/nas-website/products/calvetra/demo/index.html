.card.attn { box-shadow: 0 0 0 1px var(--cv-color-attention); }
.card.pro { box-shadow: 0 0 0 1px var(--cv-color-pro); }
.card h3 { font-size: var(--cv-font-size-lg); }
.group { background: var(--cv-color-surface); border-radius: var(--cv-radius-lg); box-shadow: var(--cv-elevation-1); overflow: hidden; }
.group > .row + .row, .group > * + .row { border-top: 1px solid var(--cv-color-line); }
.row { display: flex; align-items: center; gap: var(--cv-space-3); padding: 12px var(--cv-space-4); min-height: 52px; width: 100%; text-align: left; background: none; border: 0; color: inherit; }
a.row:hover, button.row:hover { background: var(--cv-color-surface-2); text-decoration: none; }
.row .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row .t b { font-weight: var(--cv-font-weight-medium); }
.row .t > span { color: var(--cv-color-text-2); font-size: var(--cv-font-size-sm); }
.row .end { text-align: right; font-size: var(--cv-font-size-sm); color: var(--cv-color-text-2); flex: none; }
.row .chev { color: var(--cv-color-text-3); flex: none; }
.row.sel { background: var(--cv-color-accent-soft); }
.empty { text-align: center; padding: var(--cv-space-8) var(--cv-space-4); color: var(--cv-color-text-2); }
.empty b { display: block; color: var(--cv-color-text); font-size: var(--cv-font-size-lg); margin-bottom: 4px; }

/* ===== Buttons ===== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--cv-size-tap-min); padding: 0 18px; border-radius: var(--cv-radius-md); border: 1px solid transparent; font-weight: var(--cv-font-weight-bold); font-size: var(--cv-font-size-md); background: var(--cv-color-accent); color: var(--cv-color-on-accent); text-decoration: none !important; transition: background var(--cv-motion-duration-fast) var(--cv-motion-ease-standard); }
.btn:hover { background: var(--cv-color-accent-hover); }
.btn.block { width: 100%; }
.btn.sec { background: var(--cv-color-surface); color: var(--cv-color-accent-text); border-color: var(--cv-color-line-control); }
.btn.sec:hover { background: var(--cv-color-surface-2); }
.btn.quiet { background: none; color: var(--cv-color-accent-text); padding: 0 10px; }
.btn.quiet:hover { background: var(--cv-color-surface-2); }
.btn.danger { background: var(--cv-color-surface); color: var(--cv-color-danger); border-color: var(--cv-color-danger); }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: var(--cv-font-size-sm); border-radius: var(--cv-radius-sm); }
.btn[disabled], .btn.locked { background: var(--cv-color-surface-2); color: var(--cv-color-text-3); border-color: var(--cv-color-line); cursor: not-allowed; }
.btns { display: flex; gap: var(--cv-space-2); flex-wrap: wrap; margin-top: var(--cv-space-4); }
.btns.eq > .btn { flex: 1 1 0; }
.link { color: var(--cv-color-accent-text); font-weight: var(--cv-font-weight-medium); background: none; border: 0; padding: 0; min-height: 0; text-decoration: underline; text-underline-offset: 2px; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); }

/* ===== Chips, tags, badges ===== */
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border-radius: var(--cv-radius-pill); border: 1px solid var(--cv-color-line-control); background: var(--cv-color-surface); font-size: var(--cv-font-size-sm); color: var(--cv-color-text); }
.chip:hover { background: var(--cv-color-surface-2); text-decoration: none; }
.chip[aria-pressed="true"], .chip.on { background: var(--cv-color-accent-soft); border-color: var(--cv-color-accent); color: var(--cv-color-accent-text); font-weight: var(--cv-font-weight-bold); }
.chip[aria-pressed="true"]::before, .chip.on::before { content: "✓"; font-size: 12px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: var(--cv-font-size-xs); font-weight: var(--cv-font-weight-bold); padding: 2px 8px; border-radius: var(--cv-radius-pill); background: var(--cv-color-surface-2); color: var(--cv-color-text-2); white-space: nowrap; }
.tag.pro { background: var(--cv-color-pro-soft); color: var(--cv-color-pro); }
.tag.attn { background: var(--cv-color-attention-soft); color: var(--cv-color-attention); }
.tag.good { background: var(--cv-color-good-soft); color: var(--cv-color-good); }
.tag.sample { background: var(--cv-color-sample-soft); color: var(--cv-color-sample); }
.tag.accent { background: var(--cv-color-accent-soft); color: var(--cv-color-accent-text); }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: var(--cv-font-size-xs); font-weight: var(--cv-font-weight-bold); padding: 3px 9px 3px 7px; border-radius: var(--cv-radius-pill); border: 1px solid var(--cv-color-voice-rankers); color: var(--cv-color-voice-rankers); background: var(--cv-color-surface); white-space: nowrap; }
.badge.fac { border-color: var(--cv-color-voice-faculty); color: var(--cv-color-voice-faculty); }
.badge.plat { border-color: var(--cv-color-text-2); color: var(--cv-color-text-2); }
.k { display: inline-flex; align-items: center; gap: 5px; font-size: var(--cv-font-size-xs); font-weight: var(--cv-font-weight-bold); padding: 2px 8px; border-radius: var(--cv-radius-xs); white-space: nowrap; }
.k::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
.k.new { color: var(--cv-color-kind-new); background: var(--cv-color-kind-new-soft); }
.k.revision { color: var(--cv-color-kind-revision); background: var(--cv-color-kind-revision-soft); }
.k.practice { color: var(--cv-color-kind-practice); background: var(--cv-color-kind-practice-soft); }
.k.test { color: var(--cv-color-kind-test); background: var(--cv-color-kind-test-soft); }
.k.fixed { color: var(--cv-color-kind-fixed); background: var(--cv-color-kind-fixed-soft); }
.k.own { color: var(--cv-color-kind-own); background: var(--cv-color-kind-own-soft); }
.lock { display: inline-flex; align-items: center; gap: 4px; font-size: var(--cv-font-size-xs); font-weight: var(--cv-font-weight-bold); color: var(--cv-color-pro); background: var(--cv-color-pro-soft); padding: 2px 8px; border-radius: var(--cv-radius-pill); white-space: nowrap; }

/* ===== Voices ===== */
.voices { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
.voice { border-radius: var(--cv-radius-sm); padding: 6px 8px; background: var(--cv-color-surface-2); min-width: 0; }
.voice .vn { display: block; font-size: 11px; font-weight: var(--cv-font-weight-bold); text-transform: uppercase; letter-spacing: .04em; }
.voice .vv { display: block; font-size: var(--cv-font-size-sm); font-weight: var(--cv-font-weight-medium); color: var(--cv-color-text); font-variant-numeric: tabular-nums; }
.voice .vs { display: block; font-size: 11px; color: var(--cv-color-text-3); line-height: 1.25; }
.voice.r .vn { color: var(--cv-color-voice-rankers); }
.voice.f .vn { color: var(--cv-color-voice-faculty); }
.voice.s .vn { color: var(--cv-color-voice-students); }
.voice.p .vn { color: var(--cv-color-voice-past); }
.voice.p { background: repeating-linear-gradient(135deg, var(--cv-color-surface-2) 0 6px, var(--cv-color-surface) 6px 12px); }
.voice.p .vv { color: var(--cv-color-text-3); font-weight: var(--cv-font-weight-regular); font-size: var(--cv-font-size-xs); }
.voices.compact { gap: 4px; }
.voices.compact .voice { padding: 4px 6px; }
.voices.compact .vs { display: none; }

/* ===== Plan: Today ===== */
.dayhead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: var(--cv-space-3); }
.dayhead h2 { font-family: var(--cv-font-family-display); font-size: var(--cv-font-size-2xl); font-weight: 600; }
.slot { position: relative; padding-left: 14px; margin-top: var(--cv-space-4); }
.slot::before { content: ""; position: absolute; left: 0; top: 4px; bottom: 4px; width: 4px; border-radius: 2px; background: var(--cv-color-line-strong); }
.slot.new::before { background: var(--cv-color-kind-new); }
.slot.revision::before { background: var(--cv-color-kind-revision); }
.slot.practice::before { background: var(--cv-color-kind-practice); }
.slot.test::before { background: var(--cv-color-kind-test); }
.slot.fixed::before { background: var(--cv-color-kind-fixed); }
.slot.own::before { background: var(--cv-color-kind-own); }
.slot.now .slothead .time::after { content: "now"; margin-left: 8px; font-size: 11px; padding: 1px 6px; border-radius: 99px; background: var(--cv-color-accent); color: var(--cv-color-on-accent); vertical-align: 2px; }
.slothead { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.slothead .time { font-weight: var(--cv-font-weight-bold); font-variant-numeric: tabular-nums; }
.item { display: flex; align-items: flex-start; gap: 10px; background: var(--cv-color-surface); border-radius: var(--cv-radius-md); box-shadow: var(--cv-elevation-1); padding: 8px 12px 8px 6px; }
.item + .item { margin-top: 6px; }
.item .tick { flex: none; width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; border: 0; background: none; padding: 0; margin: -4px 0; }
.item .tick i { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--cv-color-line-control); display: inline-flex; align-items: center; justify-content: center; font-style: normal; font-size: 14px; color: transparent; }
.item .tick:hover i { border-color: var(--cv-color-accent); }
.item.done .tick i { background: var(--cv-color-good); border-color: var(--cv-color-good); color: var(--cv-color-surface); }
.item.part .tick i { border-color: var(--cv-color-kind-practice); background: linear-gradient(90deg, var(--cv-color-kind-practice) 50%, transparent 50%); }
.item.skip .tick i { border-style: dashed; color: var(--cv-color-text-3); }
.item .body { flex: 1; min-width: 0; padding-top: 3px; background: none; border: 0; text-align: left; padding-left: 0; padding-right: 0; }
.item .body b { font-weight: var(--cv-font-weight-medium); display: block; }
.item.done .body b { color: var(--cv-color-text-2); }
.item .meta { font-size: var(--cv-font-size-sm); color: var(--cv-color-text-2); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 1px; }
.item .state { font-size: var(--cv-font-size-xs); font-weight: var(--cv-font-weight-bold); color: var(--cv-color-text-3); }
.item .dur { flex: none; font-size: var(--cv-font-size-sm); color: var(--cv-color-text-2); padding-top: 4px; font-variant-numeric: tabular-nums; }
.item .lbl { font-size: 11px; padding: 0 6px; border-radius: 99px; border: 1px solid currentColor; }
.item.anchor { box-shadow: 0 0 0 1px var(--cv-color-kind-test); }
.item.off { opacity: .55; }
.pinmark { color: var(--cv-color-accent-text); display: inline-flex; }
.done-line { text-align: center; color: var(--cv-color-text-2); margin-top: var(--cv-space-6); font-size: var(--cv-font-size-sm); }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 10px 14px; border-radius: var(--cv-radius-md); background: var(--cv-color-surface-2); font-size: var(--cv-font-size-sm); margin-bottom: var(--cv-space-3); }
.banner.attn { background: var(--cv-color-attention-soft); color: var(--cv-color-text); }
.banner.pro { background: var(--cv-color-pro-soft); }
.banner.accent { background: var(--cv-color-accent-soft); }
.banner .grow { flex: 1; }

/* ===== Coach ===== */
.coach { background: var(--cv-color-surface); border-radius: var(--cv-radius-lg); box-shadow: var(--cv-elevation-1); padding: 14px var(--cv-space-4); border-left: 4px solid var(--cv-color-attention); }
.coach + .coach { margin-top: var(--cv-space-3); }
.coach .ch { display: flex; gap: 8px; align-items: center; font-size: var(--cv-font-size-xs); color: var(--cv-color-attention); font-weight: var(--cv-font-weight-bold); text-transform: uppercase; letter-spacing: .05em; }
.coach .ch .rule { color: var(--cv-color-text-3); margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: var(--cv-font-weight-regular); }
.coach p.say { margin-top: 6px; font-size: var(--cv-font-size-md); }
.coach .acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; align-items: center; }

/* ===== Fit & runway ===== */
.runway { margin-top: var(--cv-space-3); }
.runway .bar { display: flex; height: 26px; border-radius: var(--cv-radius-sm); overflow: hidden; border: 1px solid var(--cv-color-line); }
.runway .bar > div { display: flex; align-items: center; justify-content: center; font-size: 10.5px; color: var(--cv-color-text-2); border-right: 1px solid var(--cv-color-surface); background: var(--cv-color-surface-2); white-space: nowrap; overflow: hidden; }
.runway .bar > div.cur { background: var(--cv-color-accent-soft); color: var(--cv-color-accent-text); font-weight: var(--cv-font-weight-bold); }
.runway .bar > div.l10 { background: var(--cv-color-kind-revision-soft); color: var(--cv-color-kind-revision); font-weight: var(--cv-font-weight-bold); }
.runway .legend { display: flex; justify-content: space-between; font-size: 11px; color: var(--cv-color-text-3); margin-top: 4px; }
.mix { display: flex; height: 12px; border-radius: 99px; overflow: hidden; margin: 8px 0 6px; }
.mix > i { display: block; height: 100%; }
.mix .new { background: var(--cv-color-kind-new); } .mix .revision { background: var(--cv-color-kind-revision); }
.mix .practice { background: var(--cv-color-kind-practice); } .mix .test { background: var(--cv-color-kind-test); }
.mixlegend { display: flex; gap: 10px; flex-wrap: wrap; font-size: var(--cv-font-size-xs); color: var(--cv-color-text-2); }

/* ===== Week ===== */
.week { display: flex; flex-direction: column; gap: var(--cv-space-3); }
.wday { background: var(--cv-color-surface); border-radius: var(--cv-radius-lg); box-shadow: var(--cv-elevation-1); padding: 10px 12px; }
.wday.today { box-shadow: 0 0 0 2px var(--cv-color-accent); }
.wday h4 { font-size: var(--cv-font-size-md); display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.wday h4 span { font-weight: var(--cv-font-weight-regular); font-size: var(--cv-font-size-xs); color: var(--cv-color-text-3); }
.wslot { border-radius: var(--cv-radius-sm); padding: 4px 6px 6px; margin-top: 6px; border: 1px dashed transparent; min-height: 36px; }
.wslot.drop-hover { border-color: var(--cv-color-accent); background: var(--cv-color-accent-soft); }
.wslot .wt { font-size: 11px; color: var(--cv-color-text-3); font-variant-numeric: tabular-nums; display: flex; gap: 6px; align-items: center; }
.wslot .wt .k { font-size: 10px; padding: 0 5px; }
.wchip { display: flex; align-items: center; gap: 6px; padding: 6px 8px; margin-top: 4px; border-radius: var(--cv-radius-sm); background: var(--cv-color-surface-2); font-size: var(--cv-font-size-sm); cursor: grab; touch-action: none; user-select: none; border: 0; width: 100%; text-align: left; min-height: 36px; }
.wchip:hover { background: var(--cv-color-surface-3); }
.wchip .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wchip .d { font-size: 11px; color: var(--cv-color-text-3); flex: none; }
.wchip.pinned { box-shadow: inset 0 0 0 1.5px var(--cv-color-accent); }
.wchip.moved-now { animation: flash 1.2s var(--cv-motion-ease-standard); }
.wchip.anchor { box-shadow: inset 0 0 0 1.5px var(--cv-color-kind-test); }
.wchip.done { text-decoration: line-through; color: var(--cv-color-text-3); }
@keyframes flash { 0% { background: var(--cv-color-accent-soft); } 100% { background: var(--cv-color-surface-2); } }
.dragghost { position: fixed; z-index: 100; pointer-events: none; opacity: .92; box-shadow: var(--cv-elevation-3); background: var(--cv-color-surface); border-radius: var(--cv-radius-sm); padding: 6px 10px; font-size: var(--cv-font-size-sm); max-width: 240px; }
.fitband { background: var(--cv-color-attention-soft); border-radius: var(--cv-radius-md); padding: 10px 14px; font-size: var(--cv-font-size-sm); margin-bottom: var(--cv-space-3); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
@media (min-width: 1024px) {
  .week.cols { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
  .week.cols .wday { padding: 8px; }
  .week.cols .wchip .d { display: none; }
}

/* ===== Routine grid ===== */
.stages { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.stages button { flex: 1 0 auto; border: 1px solid var(--cv-color-line-control); background: var(--cv-color-surface); border-radius: var(--cv-radius-sm); padding: 8px 10px; font-size: var(--cv-font-size-xs); text-align: left; min-height: var(--cv-size-tap-min); }
.stages button b { display: block; font-size: var(--cv-font-size-sm); }
.stages button[aria-pressed="true"] { border-color: var(--cv-color-accent); background: var(--cv-color-accent-soft); color: var(--cv-color-accent-text); }
.stages button.l10 b::after { content: " · revision"; font-weight: 400; }
.rgrid { display: grid; grid-template-columns: 40px repeat(7, minmax(0, 1fr)); gap: 3px; margin-top: var(--cv-space-3); font-size: 11px; }
.rgrid .hh { color: var(--cv-color-text-3); text-align: right; padding-right: 4px; font-variant-numeric: tabular-nums; height: 22px; line-height: 22px; }
.rgrid .dh { text-align: center; font-weight: var(--cv-font-weight-bold); color: var(--cv-color-text-2); padding-bottom: 4px; }
.rgrid .cell { position: relative; height: 22px; border-radius: 3px; background: var(--cv-color-surface-2); border: 0; padding: 0; }
.rgrid .cell.new { background: var(--cv-color-kind-new); } .rgrid .cell.revision { background: var(--cv-color-kind-revision); }
.rgrid .cell.practice { background: var(--cv-color-kind-practice); } .rgrid .cell.test { background: var(--cv-color-kind-test); }
.rgrid .cell.fixed { background: repeating-linear-gradient(45deg, var(--cv-color-kind-fixed) 0 3px, var(--cv-color-kind-fixed-soft) 3px 7px); }
.rgrid .cell.moved { outline: 2px solid var(--cv-color-accent); outline-offset: 1px; }
.rgrid .cell.st::after { content: attr(data-l); position: absolute; left: 3px; top: 3px; color: var(--cv-color-surface); font-size: 10px; font-weight: 700; white-space: nowrap; }
.rgrid .cell.fixed.st::after { color: var(--cv-color-text); }
.xray { display: grid; grid-template-columns: repeat(24, 1fr); height: 28px; border-radius: 6px; overflow: hidden; gap: 1px; background: var(--cv-color-line); }
.xray i { display: block; background: var(--cv-color-surface-2); }
.xray i.new { background: var(--cv-color-kind-new); } .xray i.revision { background: var(--cv-color-kind-revision); } .xray i.practice { background: var(--cv-color-kind-practice); } .xray i.test { background: var(--cv-color-kind-test); } .xray i.fixed { background: var(--cv-color-kind-fixed); }
.xlabels { display: flex; justify-content: space-between; font-size: 10px; color: var(--cv-color-text-3); margin-top: 3px; }

/* ===== Tables (board, compare) ===== */
.tbl { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--cv-color-surface); border-radius: var(--cv-radius-lg); box-shadow: var(--cv-elevation-1); overflow: hidden; font-size: var(--cv-font-size-sm); }
.tbl th, .tbl td { padding: 10px 12px; text-align: left; vertical-align: top; border-top: 1px solid var(--cv-color-line); }
.tbl thead th { border-top: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--cv-color-text-2); background: var(--cv-color-surface-2); }
.tbl tr.grp th { background: var(--cv-color-surface-2); font-size: var(--cv-font-size-xs); text-transform: uppercase; letter-spacing: .06em; color: var(--cv-color-text-2); }
.tbl td.n { font-variant-numeric: tabular-nums; }
.tbl th.vr { color: var(--cv-color-voice-rankers); } .tbl th.vf { color: var(--cv-color-voice-faculty); } .tbl th.vs { color: var(--cv-color-voice-students); } .tbl th.vp { color: var(--cv-color-voice-past); }
.tbl td.off { color: var(--cv-color-text-3); font-style: italic; }
.tbl .diff { background: var(--cv-color-attention-soft); }
.scrollx { overflow-x: auto; }
.tier { margin-top: var(--cv-space-5); }
.tier > h3 { font-size: var(--cv-font-size-md); display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
.tier > h3 span { font-weight: var(--cv-font-weight-regular); color: var(--cv-color-text-3); font-size: var(--cv-font-size-xs); }
.trow { display: flex; gap: 10px; align-items: flex-start; padding: 12px var(--cv-space-4); }
.trow + .trow { border-top: 1px solid var(--cv-color-line); }
.trow .tt { flex: 1; min-width: 0; }
.trow .tt a.tn { font-weight: var(--cv-font-weight-medium); color: var(--cv-color-text); }
.trow .tt .sec2 { font-size: var(--cv-font-size-xs); color: var(--cv-color-text-3); }
.addbtn { flex: none; min-width: 44px; min-height: 36px; border-radius: var(--cv-radius-sm); border: 1px solid var(--cv-color-line-control); background: var(--cv-color-surface); color: var(--cv-color-accent-text); font-weight: var(--cv-font-weight-bold); font-size: var(--cv-font-size-xs); padding: 0 8px; display: inline-flex; align-items: center; gap: 4px; }
.addbtn.in { border-color: transparent; background: var(--cv-color-accent-soft); }
.boardtable { display: none; }

      + (fr.preset === "intern" ? '<div class="card soft" style="margin-top:12px"><div class="row-flex"><span style="flex:1" class="small"><b>Duty</b>: Mon–Sat, 08:00–14:00. The planner works around it.</span></div><div class="row-flex" style="margin-top:6px"><label class="small">From <input class="input" style="width:96px;min-height:36px;padding:4px 8px" value="08:00" aria-label="Duty starts"></label><label class="small">to <input class="input" style="width:96px;min-height:36px;padding:4px 8px" value="14:00" aria-label="Duty ends"></label></div></div>' : "")
      + '<p style="margin-top:12px"><b>' + tot + ' hours a week.</b> <span class="muted small">This also picks your starting routine (' + { full: "Full-time", intern: "Internship with duties", working: "Working" }[fr.preset] + '), which you can change any time.</span></p><div class="btns"><a class="btn block" href="#/start/4">Next</a></div>';
  }
  if (n === 4) body = prog + head("Where should your plan start from?") + '<div style="margin-top:16px"><button class="choice" aria-pressed="' + (fr.start === "scratch") + '" data-act="fr-build" data-v="scratch"><span class="radio"></span><span class="t"><b>From scratch</b><span>The Board\'s must-know and good-to-know topics, all 19 subjects, in the Board\'s order. You can change anything.</span></span></button>'
    + '<div class="h-sec">Or from someone\'s plan</div>' + (fr.preset === "intern" ? ["plan-ranker-c", "plan-ranker-a", "plan-ranker-b", "agenda-dr-sample"] : ["plan-ranker-a", "plan-ranker-c", "plan-ranker-b", "agenda-dr-sample"]).map(function (k) { var p = POSTED[k]; return '<button class="choice" data-act="fr-build" data-v="' + k + '"><span class="radio"></span><span class="t"><b>' + p.title + '</b><span>' + (p.months ? p.months + " months · " + p.daily + " · " + (p.data === "tracked" ? "tracked in Calvetra" : "self-reported") : "An agenda for one subject; the rest from the Board") + '</span><span style="margin-top:4px">' + badgeOf(p.by) + '</span></span></button>'; }).join("") + '<button class="btn quiet" data-act="search" style="margin-top:6px">' + ICON.search + ' Search plans</button></div>';
  if (n === 5) {
    var plan = activePlan(), f = fitOf(plan), tc = topicsCount(plan);
    body = '<p class="eyebrow">Your plan is ready</p><h1 class="q">' + fitSentence(f) + '</h1><p class="faint xs">An estimate.</p>'
      + '<div class="card" style="margin-top:14px"><dl class="kv">' + (plan.basedOn ? '<dt>Based on</dt><dd>' + esc(POSTED[plan.basedOn].title) + ', in ' + esc(PEOPLE[POSTED[plan.basedOn].by].name) + '\'s order</dd>' : "") + '<dt>What went in</dt><dd>' + plural(tc.inPlan, "topic") + ' from 19 subjects' + (plan.basedOn ? "" : ", in the Board\'s order") + '</dd><dt>If time allows</dt><dd>' + plural(tc.ifTime, "lower-rated topic") + ', waiting</dd><dt>Sized to</dt><dd>' + fmtH(totalWeekHours(plan)) + ' a week in the ' + esc(routineOf(plan).name) + ' routine, and topic sizes that are estimates</dd><dt>The last 10 days</dt><dd>10–19 Jun, kept for revision</dd></dl>' + (S.frGave ? '<div class="h-sec">What had to give</div><ul class="small" style="margin:0;padding-left:18px">' + S.frGave.map(function (g) { return '<li>' + g + '</li>'; }).join("") + '</ul>' : "") + runway() + '</div>'
      + '<div class="btns" style="flex-direction:column"><button class="btn block" data-act="fr-done" data-to="#/plan/today">Open today</button><button class="btn sec block" data-act="fr-done" data-to="#/plan/whole">Look at the whole plan</button></div>';
  }
  return '<main class="content" style="padding-bottom:40px"><div class="col firstrun">' + (n > 1 && n < 5 ? '<a class="btn quiet" href="#/start/' + (n - 1) + '" style="margin-left:-10px">' + ICON.back + ' Back</a>' : '<div style="height:44px"></div>') + body + '</div></main>';
}
